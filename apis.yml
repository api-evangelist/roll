name: Roll
description: Roll was a social token infrastructure platform for the creator economy,
  letting creators and communities mint and manage their own branded ERC-20 tokens
  on the Ethereum blockchain. Founded in 2017 in New York City and backed by Techstars,
  IOSG Ventures, and Fabric Ventures (a $10M Series A), Roll offered developer APIs
  and OAuth-based integrations so third-party apps could query tokens and balances.
  The custodial Roll app and its developer API (docs.tryroll.com / api.tryroll.com)
  were sunset in April 2025 and permanently shut down on 2025-05-26; the company web
  surface no longer resolves. Added to the API Evangelist network as a portfolio
  lead; this pass confirms the company is defunct with no live API surface remaining.
